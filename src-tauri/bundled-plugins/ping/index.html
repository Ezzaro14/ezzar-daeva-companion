<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ping</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="now">
      <span class="label" data-t="now">Ping now</span>
      <span class="value" data-state="none">–</span>
    </header>
    <section class="rows">
      <label class="row">
        <span data-t="show">Show the ping widget</span>
        <input type="checkbox" class="show" />
      </label>
      <label class="row">
        <span data-t="lock">Lock the widget</span>
        <input type="checkbox" class="lock" />
      </label>
      <p class="note" data-t="lockNote">Clicks pass through to the game. Unlock to move it.</p>
      <label class="row">
        <span data-t="background">Show the background</span>
        <input type="checkbox" class="background" />
      </label>
      <label class="row">
        <span data-t="bars">Show the signal bars</span>
        <input type="checkbox" class="bars" />
      </label>
      <label class="row">
        <span data-t="size">Size</span>
        <select class="size">
          <option value="1" data-t="small">Small</option>
          <option value="1.3" data-t="medium">Medium</option>
          <option value="1.7" data-t="large">Large</option>
        </select>
      </label>
      <label class="row">
        <span data-t="good">Green up to</span>
        <span class="num"><input type="number" class="good" min="10" max="500" step="10" /> ms</span>
      </label>
      <label class="row">
        <span data-t="fair">Amber up to</span>
        <span class="num"><input type="number" class="fair" min="20" max="1000" step="10" /> ms</span>
      </label>
      <p class="note" data-t="help">Drag the widget anywhere. Double-click it to open this window.</p>
    </section>
    <script src="/_sdk/a2.js"></script>
    <script src="plugin.js"></script>
  </body>
</html>
