name: Installers

# Ezzar's Daeva Companion's installers: the Windows setup (.exe) and .msi,
# and the Linux .deb (built on Ubuntu 22.04, so it runs on older systems
# too). By hand: gh workflow run installers.yml, or push a v* tag. The .rpm
# for Fedora and Bazzite is built locally: packaging/linux/build-rpm.sh.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows setup and .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installers
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # Files a clean checkout lacks (gitignored mirrors of src/data).
      - name: Frontend data
        shell: bash
        run: |
          mkdir -p public/i18n public/data public/src/data
          cp -r src/data/i18n/* public/i18n/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/data/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/src/data/
      - name: Build
        run: |
          npm ci
          npx tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux-deb:
    name: Linux .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installers-deb
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libpcap-dev
      - name: Frontend data
        run: |
          mkdir -p public/i18n public/data public/src/data
          cp -r src/data/i18n/* public/i18n/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/data/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/src/data/
      # The hotkeys and minimap helper first: tauri.linux.conf.json packs it
      # next to the app.
      - name: Build
        run: |
          npm ci
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin daeva-companion-hotkeys
          npx tauri build --bundles deb
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
