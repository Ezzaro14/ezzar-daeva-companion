name: Installers

# Ezzar's Daeva Companion's installers: the Windows .msi, the Linux .deb (built on Ubuntu 22.04, so it runs on older systems
# too) and the .rpm for Fedora and Bazzite (packaging/linux/build-rpm.sh, in
# a Fedora container). By hand: gh workflow run installers.yml, or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installers
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # Files a clean checkout lacks (gitignored mirrors of src/data).
      - name: Frontend data
        shell: bash
        run: |
          mkdir -p public/i18n public/data public/src/data
          cp -r src/data/i18n/* public/i18n/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/data/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/src/data/
      - name: Build
        run: |
          npm ci
          npx tauri build --bundles msi
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          # No NSIS setup: its script breaks on the apostrophe in the name.
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux-deb:
    name: Linux .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installers-deb
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libpcap-dev
      - name: Frontend data
        run: |
          mkdir -p public/i18n public/data public/src/data
          cp -r src/data/i18n/* public/i18n/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/data/
          cp src/data/skill_icons.json src/data/dot_skill_ids.json public/src/data/
      # The hotkeys and minimap helper first: tauri.linux.conf.json packs it
      # next to the app.
      - name: Build
        run: |
          npm ci
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin daeva-companion-hotkeys
          npx tauri build --bundles deb
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  linux-rpm:
    name: Linux .rpm
    runs-on: ubuntu-24.04
    # Fedora's own rpmbuild, as build-rpm.sh expects (a Fedora toolbox): its
    # package carries the capture permission (%caps), which rpm-ostree keeps.
    container: fedora:44
    steps:
      # docs/linux.md's build dependencies for Fedora, libxdo (Tauri's menus),
      # and rpm-build and cpio for build-rpm.sh.
      - name: Build dependencies
        run: |
          dnf install -y webkit2gtk4.1-devel openssl-devel curl wget file libappindicator-gtk3-devel \
            librsvg2-devel libpcap libpcap-devel libcap libxdo-devel git rpm-build cpio nodejs npm \
            gcc gcc-c++ make
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installers-rpm
      - name: Build
        run: bash packaging/linux/build-rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          path: out/*.rpm
          if-no-files-found: error
